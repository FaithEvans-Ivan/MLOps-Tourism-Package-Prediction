name: Tourism Project CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Validate dataset
        run: |
          python tourism_project/model_building/data_register.py

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv


  data-preparation:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Prepare data
        run: |
          python tourism_project/model_building/prep.py

      - name: Upload train/test splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv


  model-training:
    name: Model Training
    needs: data-preparation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tourism_project/requirements.txt

      - name: Download train/test splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Start MLflow server
        run: |
          nohup mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            > mlflow.log 2>&1 &

          sleep 10

          curl --fail http://127.0.0.1:5000/health

      - name: Train model
        run: |
          python tourism_project/model_building/train.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: tourism_project/deployment/best_Tourism-Project_model_v1.joblib

      - name: Upload MLflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-logs
          path: mlflow.log
```
